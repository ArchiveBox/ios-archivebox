name: Capture native app screenshots

on:
  schedule:
    - cron: '43 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      key: ${{ steps.check.outputs.key }}
      backend: ${{ steps.check.outputs.backend }}
    steps:
      - id: check
        uses: ArchiveBox/monorepo/.github/actions/changed-scheduled-inputs@main
        with:
          backend: dev

  build-macos:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    concurrency:
      group: macos-capture-build-${{ github.ref }}
      cancel-in-progress: false
    # Siri schemas need SDK27; the app supports macOS26. Keep WebKit captures on
    # stable macOS: the macOS27 preview image fails IOSurface creation even for
    # an isolated sandboxed WKWebView loading example.com.
    runs-on: xcode-27
    environment: testflight
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record the checked-out source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'
      - name: Prepare pinned Safari extension
        run: node scripts/prepare-safari.mjs
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the signed Mac app with SDK27
        env:
          DEVELOPER_ID_PROFILES: ${{ secrets.DEVELOPER_ID_PROFILES }}
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
        run: bash scripts/capture-app-screenshots.sh macos build/screenshots/macos-build build
      - uses: actions/upload-artifact@v4
        with:
          name: macos-capture-app
          path: build/screenshots/macos-build/ArchiveBox.app.zip
          if-no-files-found: error
          retention-days: 7
      - name: Restore the standard app project
        run: xcodegen generate
      - name: Build the iPhone app with SDK27
        run: |
          xcodebuild -project ArchiveBox.xcodeproj -scheme ArchiveBox \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/screenshots/iphone-build/DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= build
          app=build/screenshots/iphone-build/DerivedData/Build/Products/Debug-iphonesimulator/ArchiveBox.app
          test -d "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" build/screenshots/iphone-build/ArchiveBox.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-capture-app
          path: build/screenshots/iphone-build/ArchiveBox.app.zip
          if-no-files-found: error
          retention-days: 7

  capture:
    needs: [changes, build-macos]
    env:
      SOURCE_SHA: ${{ needs.build-macos.outputs.source_sha }}
      BACKEND_REVISION: ${{ needs.changes.outputs.backend }}
    concurrency:
      group: app-captures-${{ matrix.platform }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        # Server companion screenshots are captured locally with capture-app-screenshots.sh.
        platform: [iphone, macos]
    # iOS26 startup on the 7GB host evicted Daphne's working set and stalled
    # real API/UI requests. The 14GB ARM host passed fresh gallery runs
    # 37185900511 and 37186470168 with stock Simulator services and no swap.
    # Keep Mac WebKit on stable macOS26 (macOS27 fails IOSurface creation).
    runs-on: ${{ matrix.platform == 'iphone' && 'macos-26-xlarge' || 'macos-26' }}
    environment: testflight
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-macos.outputs.source_sha }}
      - name: Set the disposable Mac desktop size
        if: matrix.platform != 'iphone'
        run: |
          brew install displayplacer
          displayplacer list
          screen_id=$(displayplacer list | awk '/Persistent screen id:/ {print $4; exit}')
          test -n "$screen_id"
          displayplacer "id:$screen_id res:1920x1080 scaling:off"
          swift -e 'import AppKit; let size = NSScreen.main!.frame.size; print("Desktop: \(size)"); precondition(size.width >= 1920 && size.height >= 1080, "Capture desktop is too small")'
      - name: Disable host Spotlight indexing on the disposable iPhone runner
        if: matrix.platform == 'iphone'
        # Resource samples show host indexers competing with the Simulator.
        # This changes only the ephemeral host, not Simulator services or app behavior.
        run: |
          sudo mdutil -i off / /System/Volumes/Data
          mdutil -s / /System/Volumes/Data
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/download-artifact@v4
        if: matrix.platform == 'iphone'
        with:
          name: iphone-capture-app
          path: build/screenshots/iphone-app
      - name: Extract the SDK27 iPhone app for stable iOS capture
        if: matrix.platform == 'iphone'
        run: |
          ditto -x -k build/screenshots/iphone-app/ArchiveBox.app.zip build/screenshots/iphone-app
          app="$GITHUB_WORKSPACE/build/screenshots/iphone-app/ArchiveBox.app"
          test -d "$app"
          echo "ARCHIVEBOX_IPHONE_APP=$app" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        if: matrix.platform == 'macos'
        with:
          name: macos-capture-app
          path: build/screenshots/macos-app
      - name: Extract the signed SDK27 app for stable macOS capture
        if: matrix.platform == 'macos'
        run: |
          ditto -x -k build/screenshots/macos-app/ArchiveBox.app.zip build/screenshots/macos-app
          echo "ARCHIVEBOX_MAC_APP=$GITHUB_WORKSPACE/build/screenshots/macos-app/ArchiveBox.app" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: ArchiveBox/ArchiveBox
          ref: ${{ env.BACKEND_REVISION }}
          path: backend
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - name: Install the real ArchiveBox server
        run: |
          echo "BACKEND_REVISION=$(git -C backend rev-parse HEAD)" >> "$GITHUB_ENV"
          uv sync --frozen --project backend
      - name: Populate and start a disposable archive
        run: bash scripts/start-screenshot-server.sh "$GITHUB_WORKSPACE/backend" "$RUNNER_TEMP/screenshot-server"
      - name: Record capture provenance
        env:
          CAPTURE_PLATFORM: ${{ matrix.platform }}
          CAPTURE_BACKEND: ${{ env.BACKEND_REVISION }}
        run: |
          uv run --no-project python - <<'PY'
          import json, os
          from pathlib import Path
          platform = os.environ['CAPTURE_PLATFORM']
          output = Path('build/screenshots') / platform
          output.mkdir(parents=True, exist_ok=True)
          (output / 'metadata.json').write_text(json.dumps({
              'platform': platform,
              'revision': os.environ['SOURCE_SHA'],
              'backend_revision': os.environ['CAPTURE_BACKEND'],
              'run_id': os.environ['GITHUB_RUN_ID'],
          }) + '\n')
          PY
      - name: Start a clean iPhone Simulator
        if: matrix.platform == 'iphone'
        id: simulator
        uses: futureware-tech/simulator-action@c768f52966d5f70335ec77881f9806b24a52f80e
        with:
          model: iPhone 17 Pro
          os: iOS
          os_version: '^26.5'
          erase_before_boot: true
          wait_for_boot: true
          boot_retries: 0
          settle_timeout_seconds: 0
      - name: Capture every native app screen with XCTest
        env:
          ARCHIVEBOX_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: bash scripts/capture-app-screenshots.sh '${{ matrix.platform }}' 'build/screenshots/${{ matrix.platform }}' gallery
      - name: Validate this complete capture group
        env:
          CAPTURE_BACKEND: ${{ env.BACKEND_REVISION }}
        run: uv run --no-project python scripts/build-screenshot-gallery.py --platform '${{ matrix.platform }}' --revision "$SOURCE_SHA" --backend-revision "$CAPTURE_BACKEND"
      - uses: actions/upload-artifact@v4
        with:
          name: site-screenshots-${{ matrix.platform }}
          path: build/screenshots/gallery
          if-no-files-found: error
          retention-days: 90
      - name: Publish this completed screenshot group
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - uses: actions/upload-artifact@v4
        with:
          name: app-screenshots-${{ matrix.platform }}
          path: |
            build/screenshots/${{ matrix.platform }}/attachments/
            build/screenshots/${{ matrix.platform }}/metadata.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshot-diagnostics-${{ matrix.platform }}
          path: |
            build/screenshots/${{ matrix.platform }}/Capture.xcresult/
            ${{ runner.temp }}/screenshot-server/server.log
            ${{ runner.temp }}/screenshot-server/logs/worker_daphne.log
            ${{ runner.temp }}/screenshot-server/logs/worker_runner.log
            ${{ runner.temp }}/screenshot-server/logs/supervisord.log
            ${{ runner.temp }}/screenshot-server/logs/errors.log
          retention-days: 7

  complete:
    name: 'Scheduled inputs: ${{ needs.changes.outputs.key }}'
    needs: [changes, capture, build-macos]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Scheduled work completed successfully.'
