name: TestFlight
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to publish
        type: choice
        options: [both, iOS, macOS]
        default: both
      version:
        description: App version
        default: '1.0'
        required: true
  push:
    tags: ['testflight-*']
permissions:
  contents: read
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_TEAM_ID: Q3VA4FKRSA
      ASC_APP_ID: '6769185501'
      ASC_GROUP_ID: b81f9549-9f73-4e34-8204-14589fd2f58a
      RELEASE_PLATFORM: ${{ inputs.platform || 'both' }}
      RELEASE_VERSION: ${{ inputs.version || '1.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'
      - name: Prepare pinned Safari extension
        run: node scripts/prepare-safari.mjs
      - name: Test shared code
        run: swift test
      - name: Archive, upload, and enable internal testing
        run: bash scripts/testflight.sh
      - name: Remove API credential
        if: always()
        run: rm -f "$RUNNER_TEMP/ArchiveBox-AuthKey.p8"
