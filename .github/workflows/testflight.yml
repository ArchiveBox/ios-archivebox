name: TestFlight
# "testflight" names the delivery environment; signing is App Store distribution.
on:
  workflow_call:
    inputs:
      platform:
        type: string
        default: both
      version:
        type: string
        required: true
      ref:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to publish
        type: choice
        options: [both, iOS, macOS]
        default: both
      version:
        description: App version
        default: '1.0'
        required: true
  push:
    tags: ['testflight-*']
permissions:
  contents: read
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  release:
    runs-on: xcode-27
    environment: testflight
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
      APPLE_DEVELOPMENT_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_PASSWORD }}
      APPLE_TEAM_ID: Q3VA4FKRSA
      ASC_APP_ID: '6769185501'
      ASC_GROUP_ID: b81f9549-9f73-4e34-8204-14589fd2f58a
      ASC_PUBLIC_GROUP_ID: ${{ vars.ASC_PUBLIC_GROUP_ID }}
      RELEASE_REF: ${{ inputs.ref }}
      RELEASE_PLATFORM: ${{ inputs.platform || 'both' }}
      RELEASE_VERSION: ${{ inputs.version || '1.0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'
      - name: Prepare pinned Safari extension
        run: node scripts/prepare-safari.mjs
      - name: Test shared code
        run: swift test
      - name: Archive, upload, and enable internal testing
        run: bash scripts/testflight.sh
