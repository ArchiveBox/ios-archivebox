name: App website
on:
  push:
    branches: [main]
    paths: [README.md, 'docs/site/**', 'docs/screenshots/**', 'App/AppIcon.icon/Assets/ArchiveBox.png', 'App/Assets.xcassets/ShareSheetGuide.imageset/share-sheet.png', '.github/workflows/pages.yml']
  pull_request:
    paths: [README.md, 'docs/site/**', 'docs/screenshots/**', 'App/AppIcon.icon/Assets/ArchiveBox.png', 'App/Assets.xcassets/ShareSheetGuide.imageset/share-sheet.png', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-website-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs/site
      - name: Build from the README
        run: bash docs/site/build.sh
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/_site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v5
        id: deployment
