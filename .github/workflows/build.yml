name: Build
on:
  push:
    paths-ignore: ['.github/pages/**', 'README.md', 'docs/site/**', '.github/workflows/pages.yml']
  pull_request:
    paths-ignore: ['.github/pages/**', 'README.md', 'docs/site/**', '.github/workflows/pages.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'
      - name: Prepare pinned WXT Safari extension
        run: node scripts/prepare-safari.mjs
      - name: Swift package tests
        run: swift test
      - name: Build iOS app with Share, Safari, and Widgets extensions
        run: >-
          xcodebuild -project ArchiveBox.xcodeproj -scheme ArchiveBox
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Build native macOS app with Share, Safari, and Widgets extensions
        run: >-
          xcodebuild -project ArchiveBox.xcodeproj -scheme ArchiveBoxMac
          -destination 'generic/platform=macOS' -derivedDataPath build-mac
          CODE_SIGNING_ALLOWED=NO build
      - name: Build direct-download macOS client
        run: >-
          xcodebuild -project ArchiveBox.xcodeproj -scheme ArchiveBoxMacDirect
          -destination 'generic/platform=macOS' -derivedDataPath build-direct
          CODE_SIGNING_ALLOWED=NO build
      - name: Build optional server companion code
        working-directory: ServerApp
        run: swift build --build-system native -c release
