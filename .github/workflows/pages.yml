name: App website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ['Capture native app screenshots']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  # Failed captures must not displace a pending push deployment.
  group: fast-pages-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.run_id || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - uses: astral-sh/setup-uv@v7
      - name: Restore latest complete screenshots
        run: uv run --no-project python scripts/restore-site-screenshots.py ios build/screenshots/gallery
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs/site
      - name: Build current README and site with existing captures
        run: bash docs/site/build.sh
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/_site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
