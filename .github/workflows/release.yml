name: Release apps
on:
  push:
    branches: [main]
    paths-ignore: ['.github/pages/**', 'README.md', 'docs/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
# Reserve versions and publish in order. New pushes can supersede queued candidates.
concurrency:
  group: release-apps-main
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.version.outputs.ready }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reserve version for this main commit
        id: version
        run: node scripts/release.mjs prepare
  release:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: xcode-27
    environment: testflight
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'
      - uses: astral-sh/setup-uv@v7
      - name: Prepare pinned Safari extension
        run: node scripts/prepare-safari.mjs
      - name: Test shared code
        run: swift test
      - name: Resolve current ArchiveBox dev image from both registries
        id: server-image
        run: uv run --no-project python ServerApp/server-image.py resolve
      - uses: actions/cache/restore@v4
        id: payload
        with:
          path: |
            ServerApp/vendor
            ServerApp/payload/images.tar
            ServerApp/payload/vmlinux
          key: server-payload-arm64-${{ steps.server-image.outputs.digest }}-${{ hashFiles('ServerApp/prepare.sh', 'ServerApp/server-image.py') }}
      - name: Download resolved server runtime and images
        if: steps.payload.outputs.cache-hit != 'true'
        env:
          ARCHIVEBOX_SERVER_IMAGE: ${{ steps.server-image.outputs.image }}
        run: bash ServerApp/prepare.sh
      - uses: actions/cache/save@v4
        if: steps.payload.outputs.cache-hit != 'true'
        with:
          path: |
            ServerApp/vendor
            ServerApp/payload/images.tar
            ServerApp/payload/vmlinux
          key: server-payload-arm64-${{ steps.server-image.outputs.digest }}-${{ hashFiles('ServerApp/prepare.sh', 'ServerApp/server-image.py') }}
      - name: Build, sign, notarize and verify both ZIPs
        env:
          ARCHIVEBOX_SERVER_IMAGE: ${{ steps.server-image.outputs.image }}
          DEVELOPER_ID_PROFILES: ${{ secrets.DEVELOPER_ID_PROFILES }}
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash scripts/release-macos.sh
      - name: Publish tested artifacts and release notes
        id: publish
        env:
          TESTFLIGHT_PUBLIC_URL: ${{ vars.TESTFLIGHT_PUBLIC_URL }}
        run: node scripts/release.mjs publish
  testflight:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    uses: ./.github/workflows/testflight.yml
    secrets: inherit
    with:
      platform: both
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
