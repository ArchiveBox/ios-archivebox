name: Native screenshot feasibility
on:
  workflow_dispatch:
    inputs:
      mac_only:
        description: Check only native macOS signing and capture
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.mac_only && '["macos"]' || '["iphone", "macos"]') }}
    environment: testflight
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'
      - name: Prepare pinned Safari extension
        run: node scripts/prepare-safari.mjs
      - name: Generate screenshot test schemes
        run: brew install xcodegen && xcodegen generate
      - name: Capture the real app with XCTest
        env:
          DEVELOPER_ID_PROFILES: ${{ matrix.platform == 'macos' && secrets.DEVELOPER_ID_PROFILES || '' }}
          DEVELOPER_ID_P12: ${{ matrix.platform == 'macos' && secrets.DEVELOPER_ID_P12 || '' }}
          DEVELOPER_ID_PASSWORD: ${{ matrix.platform == 'macos' && secrets.DEVELOPER_ID_PASSWORD || '' }}
        run: bash scripts/capture-app-screenshots.sh '${{ matrix.platform }}'
      - name: Preserve native capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-capture-${{ matrix.platform }}
          path: |
            build/screenshots/*/attachments/
            build/screenshots/*/Capture.xcresult/
            ArchiveBox.xcodeproj/
          if-no-files-found: error
          retention-days: 7
