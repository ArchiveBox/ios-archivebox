name: ArchiveBox
configs:
  Debug: debug
  Release: release
  DebugDirect: debug
  ReleaseDirect: release
options:
  bundleIdPrefix: io.archivebox
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'
  xcodeVersion: '26.0'
packages:
  ArchiveBoxCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    'ARCHS[sdk=macosx*]': arm64
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    # Set a team in Xcode or pass DEVELOPMENT_TEAM=... when building for a device.
    ARCHIVEBOX_KEYCHAIN_GROUP: '$(AppIdentifierPrefix)io.archivebox.shared'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  ArchiveBox:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ArchiveBoxCore
      - target: ArchiveBoxShare
      - target: ArchiveBoxSafari
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: io.archivebox.navigation
            CFBundleURLSchemes: [archivebox]
        CFBundleDisplayName: ArchiveBox
        ArchiveBoxKeychainGroup: '$(ARCHIVEBOX_KEYCHAIN_GROUP)'
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBonjourServices: ["_archivebox._tcp"]
        NSLocalNetworkUsageDescription: Find ArchiveBox servers nearby and connect to your archive.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: App/ArchiveBox.entitlements
      properties:
        keychain-access-groups: ['$(ARCHIVEBOX_KEYCHAIN_GROUP)']
  ArchiveBoxShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - App/AppEnvironment.swift
      - App/Assets.xcassets
    dependencies:
      - package: ArchiveBoxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.archivebox.ArchiveBox.Share
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: ArchiveBox
        ArchiveBoxKeychainGroup: '$(ARCHIVEBOX_KEYCHAIN_GROUP)'
        NSLocalNetworkUsageDescription: Send shared links to your ArchiveBox server on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: '$(PRODUCT_MODULE_NAME).ShareViewController'
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 20
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/ArchiveBoxShare.entitlements
      properties:
        keychain-access-groups: ['$(ARCHIVEBOX_KEYCHAIN_GROUP)']
  ArchiveBoxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ArchiveBox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ArchiveBoxMac:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [Info.plist, ArchiveBox.entitlements]
      - MacApp
      - MacLocalUI
    dependencies:
      - package: ArchiveBoxCore
      - target: ArchiveBoxMacShare
      - target: ArchiveBoxMacSafari
    settings:
      base:
        PRODUCT_NAME: ArchiveBox
        PRODUCT_BUNDLE_IDENTIFIER: io.archivebox.ArchiveBox
        CODE_SIGN_ENTITLEMENTS: MacApp/ArchiveBoxMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        DebugDirect:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) DIRECT_DOWNLOAD'
          CODE_SIGN_ENTITLEMENTS: MacApp/ArchiveBoxDirect.entitlements
        ReleaseDirect:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) DIRECT_DOWNLOAD'
          CODE_SIGN_ENTITLEMENTS: MacApp/ArchiveBoxDirect.entitlements
    info:
      path: MacApp/Info.plist
      properties:
        CFBundleDisplayName: ArchiveBox
        ArchiveBoxKeychainGroup: '$(ARCHIVEBOX_KEYCHAIN_GROUP)'
        CFBundleURLTypes:
          - CFBundleURLName: io.archivebox.navigation
            CFBundleURLSchemes: [archivebox]
        LSApplicationCategoryType: public.app-category.utilities
        NSServices:
          - NSMenuItem:
              default: Add URL to ArchiveBox
            NSMessage: addURLToArchiveBox
            NSPortName: ArchiveBox
            NSSendTypes: [public.url, public.utf8-plain-text, public.rtf]
            NSRequiredContext: {}
        NSBonjourServices: ["_archivebox._tcp"]
        NSLocalNetworkUsageDescription: Find ArchiveBox servers nearby and connect to your archive.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  ArchiveBoxMacShare:
    type: app-extension
    platform: macOS
    sources:
      - MacShareExtension
      - ShareExtension/ShareModel.swift
      - ShareExtension/ShareView.swift
      - App/AppEnvironment.swift
      - App/Assets.xcassets
    dependencies:
      - package: ArchiveBoxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.archivebox.ArchiveBox.Share
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: MacShareExtension/Info.plist
      properties:
        CFBundleDisplayName: ArchiveBox
        ArchiveBoxKeychainGroup: '$(ARCHIVEBOX_KEYCHAIN_GROUP)'
        NSLocalNetworkUsageDescription: Send shared links to your ArchiveBox server on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: '$(PRODUCT_MODULE_NAME).MacShareViewController'
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 20
              NSExtensionActivationSupportsText: true
    entitlements:
      path: MacShareExtension/ArchiveBoxMacShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups: ['$(ARCHIVEBOX_KEYCHAIN_GROUP)']
  ArchiveBoxSafari:
    type: app-extension
    platform: iOS
    sources: &safariSources
      - SafariWebExtension/SafariWebExtensionHandler.swift
      - App/AppEnvironment.swift
      - path: SafariWebExtension/Resources
        excludes: [assets, chunks, content-scripts, icon, _locales]
        buildPhase: resources
      - path: SafariWebExtension/Resources/assets
        type: folder
        buildPhase: resources
      - path: SafariWebExtension/Resources/chunks
        type: folder
        buildPhase: resources
      - path: SafariWebExtension/Resources/content-scripts
        type: folder
        buildPhase: resources
      - path: SafariWebExtension/Resources/icon
        type: folder
        buildPhase: resources
      - path: SafariWebExtension/Resources/_locales
        type: folder
        buildPhase: resources
    dependencies:
      - package: ArchiveBoxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.archivebox.ArchiveBox.Safari
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: SafariWebExtension/Info-iOS.plist
      properties: &safariInfo
        CFBundleDisplayName: ArchiveBox
        ArchiveBoxKeychainGroup: '$(ARCHIVEBOX_KEYCHAIN_GROUP)'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: '$(PRODUCT_MODULE_NAME).SafariWebExtensionHandler'
    entitlements:
      path: SafariWebExtension/ArchiveBoxSafari.entitlements
      properties:
        keychain-access-groups: ['$(ARCHIVEBOX_KEYCHAIN_GROUP)']
  ArchiveBoxMacSafari:
    type: app-extension
    platform: macOS
    sources: *safariSources
    dependencies:
      - package: ArchiveBoxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.archivebox.ArchiveBox.Safari
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: SafariWebExtension/Info-macOS.plist
      properties: *safariInfo
    entitlements:
      path: SafariWebExtension/ArchiveBoxMacSafari.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups: ['$(ARCHIVEBOX_KEYCHAIN_GROUP)']
  ArchiveBoxScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources: [ScreenshotTests]
    dependencies:
      - target: ArchiveBox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ArchiveBoxMacScreenshots:
    type: bundle.ui-testing
    platform: macOS
    sources: [ScreenshotTests]
    dependencies:
      - target: ArchiveBoxMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ArchiveBoxMacDirect:
    build:
      targets:
        ArchiveBoxMac: all
    run:
      config: DebugDirect
    archive:
      config: ReleaseDirect
  ArchiveBoxMac:
    build:
      targets:
        ArchiveBoxMac: all
  ArchiveBox:
    build:
      targets:
        ArchiveBox: all
        ArchiveBoxUITests: [test]
    test:
      targets: [ArchiveBoxUITests]
      environmentVariables:
        ARCHIVEBOX_TEST_SERVER: '$(ARCHIVEBOX_TEST_SERVER)'
        ARCHIVEBOX_TEST_TOKEN: '$(ARCHIVEBOX_TEST_TOKEN)'
  ArchiveBoxScreenshots:
    build:
      targets:
        ArchiveBox: all
        ArchiveBoxScreenshots: [test]
    test:
      targets: [ArchiveBoxScreenshots]
      environmentVariables:
        ARCHIVEBOX_TEST_SERVER: '$(ARCHIVEBOX_TEST_SERVER)'
        ARCHIVEBOX_TEST_TOKEN: '$(ARCHIVEBOX_TEST_TOKEN)'
  ArchiveBoxMacScreenshots:
    build:
      targets:
        ArchiveBoxMac: all
        ArchiveBoxMacScreenshots: [test]
    test:
      targets: [ArchiveBoxMacScreenshots]
      environmentVariables:
        ARCHIVEBOX_TEST_SERVER: '$(ARCHIVEBOX_TEST_SERVER)'
        ARCHIVEBOX_TEST_TOKEN: '$(ARCHIVEBOX_TEST_TOKEN)'
