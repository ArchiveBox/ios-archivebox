name: Diagnose Simulator server latency
on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        default: macos-26
        options: [macos-26, macos-26-xlarge, macos-15]
      simulator_action:
        description: Compare a freshly erased device using simulator-action
        type: boolean
        default: false
      early_boot:
        description: Start Simulator before installing and populating the backend
        type: boolean
        default: false
      quiesce:
        type: boolean
        default: false
      gallery:
        description: Run the unchanged real UI tour instead of the API benchmark
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ArchiveBox/ArchiveBox
          ref: ${{ inputs.gallery && 'df13c2c84c8c202d258b840df08122b7e66fe1e3' || 'dev' }}
          path: backend
          persist-credentials: false
      - name: Boot Simulator before backend setup
        if: inputs.early_boot
        run: |
          device=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries | map(select(.key | contains("iOS-26"))) | sort_by(.key) | reverse | map(.value[]) | map(select(.name | startswith("iPhone"))) | first | .udid')
          xcrun simctl bootstatus "$device" -b
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: uv sync --frozen --project backend
      - run: brew install py-spy
      - if: inputs.gallery
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: inputs.gallery
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'
      - if: inputs.gallery
        run: |
          brew install xcodegen
          sudo mdutil -i off / /System/Volumes/Data
      - if: inputs.gallery
        uses: actions/download-artifact@v4
        with:
          name: iphone-capture-app
          run-id: '37182161933'
          github-token: ${{ github.token }}
          path: build/screenshots/iphone-app
      - if: inputs.gallery
        run: |
          ditto -x -k build/screenshots/iphone-app/ArchiveBox.app.zip build/screenshots/iphone-app
          echo "ARCHIVEBOX_IPHONE_APP=$GITHUB_WORKSPACE/build/screenshots/iphone-app/ArchiveBox.app" >> "$GITHUB_ENV"
      - if: inputs.runner == 'macos-15'
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app
      - run: bash scripts/start-screenshot-server.sh "$GITHUB_WORKSPACE/backend" "$RUNNER_TEMP/screenshot-server"
      - name: Boot a clean device with simulator-action
        if: inputs.simulator_action
        uses: futureware-tech/simulator-action@c768f52966d5f70335ec77881f9806b24a52f80e
        with:
          model: iPhone 17 Pro
          os: iOS
          os_version: '26.5'
          erase_before_boot: true
          wait_for_boot: true
          boot_retries: 0
          settle_timeout_seconds: 0
      - name: Run the capture workflow's exact Simulator helper
        if: inputs.quiesce
        run: |
          yq -r '.jobs.capture.steps[] | select(.name == "Quiesce stock Simulator posters and widgets on the disposable iPhone runner") | .run' .github/workflows/screenshots.yml > "$RUNNER_TEMP/start-helper.sh"
          bash "$RUNNER_TEMP/start-helper.sh"
      - name: Measure real requests across Simulator boot and profiler attachment
        if: ${{ !inputs.gallery }}
        run: uv run --no-sync --project backend python scripts/diagnose-server.py
      - name: Run the unchanged real UI tour
        if: inputs.gallery
        run: bash scripts/capture-app-screenshots.sh iphone build/screenshots/iphone gallery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-latency-diagnostics
          path: |
            ${{ runner.temp }}/server-latency/
            ${{ runner.temp }}/screenshot-server/logs/worker_daphne.log
            build/screenshots/iphone/*.log
            build/screenshots/iphone/*.json
            build/screenshots/iphone/*.sample.txt
            build/screenshots/iphone/Capture.xcresult
          if-no-files-found: error
