name: Diagnose isolated WebKit painting
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Build the isolated public-API WebKit reproduction
        run: |
          mkdir -p "$RUNNER_TEMP/webkit-paint-probe"
          cd "$RUNNER_TEMP/webkit-paint-probe"
          cat > Probe.swift <<'EOF'
          import SwiftUI
          import WebKit
          
          @main
          struct WebKitPaintProbeApp: App {
              @State private var session = ProbeSession()
          
              var body: some Scene {
                  Window("WebKitPaintProbe", id: "probe") {
                      ProbeView(page: session.page)
                          .frame(minWidth: 600, minHeight: 500)
                          .task { session.load() }
                  }
                  .defaultSize(width: 800, height: 760)
              }
          }
          
          @MainActor
          final class ProbeSession: NSObject, WKNavigationDelegate {
              let page: WKWebView
              private var started = false
          
              override init() {
                  let configuration = WKWebViewConfiguration()
                  configuration.websiteDataStore = .nonPersistent()
                  page = WKWebView(frame: .zero, configuration: configuration)
                  super.init()
                  page.navigationDelegate = self
                  page.allowsBackForwardNavigationGestures = true
              }
          
              func load() {
                  guard !started else { return }
                  started = true
                  page.load(URLRequest(url: URL(string: "https://example.com")!))
              }
          
              func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                  print("Finished actual page: \(webView.url?.absoluteString ?? "none"), frame=\(webView.frame), loading=\(webView.isLoading)")
              }
          
              func webView(_ webView: WKWebView, didFailProvisionalNavigation navigation: WKNavigation!, withError error: Error) {
                  print("Page navigation failed: \(error)")
              }
          }
          
          private struct ProbeView: NSViewRepresentable {
              let page: WKWebView
              func makeNSView(context: Context) -> WKWebView { page }
              func updateNSView(_ view: WKWebView, context: Context) {}
          }
          EOF
          cat > Probe.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>com.apple.security.app-sandbox</key><true/>
          <key>com.apple.security.network.client</key><true/>
          </dict></plist>
          EOF
          cat > project.yml <<'EOF'
          name: WebKitPaintProbe
          options:
            deploymentTarget:
              macOS: '26.0'
          settings:
            base:
              CODE_SIGN_IDENTITY: '-'
              CODE_SIGNING_REQUIRED: NO
              DEVELOPMENT_TEAM: ''
              SWIFT_VERSION: '6.0'
              ARCHS: arm64
          targets:
            WebKitPaintProbe:
              type: application
              platform: macOS
              sources: [Probe.swift]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: io.archivebox.diagnostics.WebKitPaintProbe
                  CODE_SIGN_ENTITLEMENTS: Probe.entitlements
                  ENABLE_HARDENED_RUNTIME: YES
                  OTHER_CODE_SIGN_FLAGS: '--options runtime'
                  GENERATE_INFOPLIST_FILE: YES
            WebKitPaintProbeTests:
              type: bundle.ui-testing
              platform: macOS
              sources: [PaintTests.swift]
              dependencies:
                - target: WebKitPaintProbe
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: io.archivebox.diagnostics.WebKitPaintProbeTests
                  GENERATE_INFOPLIST_FILE: YES
          schemes:
            WebKitPaintProbeTests:
              build:
                targets:
                  WebKitPaintProbe: all
                  WebKitPaintProbeTests: [test]
              test:
                config: Release
                targets: [WebKitPaintProbeTests]
          EOF
          cat > PaintTests.swift <<'EOF'
          import XCTest
          
          @MainActor
          final class PaintTests: XCTestCase {
              func testRealWebPage() {
                  continueAfterFailure = false
                  let app = XCUIApplication()
                  app.launch()
                  XCTAssertTrue(app.windows.firstMatch.waitForExistence(timeout: 15), app.debugDescription)
                  let text = app.webViews.staticTexts.matching(NSPredicate(
                      format: "label == %@ OR CAST(value, 'NSString') == %@", "Example Domain", "Example Domain"
                  )).firstMatch
                  XCTAssertTrue(text.waitForExistence(timeout: 30), app.debugDescription)
                  XCTAssertTrue(text.isHittable, app.debugDescription)
                  print(app.debugDescription)
                  let window = XCTAttachment(screenshot: app.windows.firstMatch.screenshot())
                  window.name = "real-example-window"
                  window.lifetime = .keepAlways
                  add(window)
                  let screen = XCTAttachment(screenshot: XCUIScreen.main.screenshot())
                  screen.name = "real-example-screen"
                  screen.lifetime = .keepAlways
                  add(screen)
              }
          }
          EOF
          brew install xcodegen
          xcodegen generate
      - name: Capture the real example.com page through XCTest
        run: |
          cd "$RUNNER_TEMP/webkit-paint-probe"
          xcodebuild -project WebKitPaintProbe.xcodeproj -scheme WebKitPaintProbeTests \
            -destination 'platform=macOS' -derivedDataPath build \
            -resultBundlePath "$RUNNER_TEMP/WebKitPaintProbe.xcresult" \
            -parallel-testing-enabled NO test
      - name: Preserve diagnostic evidence for manual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-webkit-paint
          path: ${{ runner.temp }}/WebKitPaintProbe.xcresult
          if-no-files-found: error
          retention-days: 7
