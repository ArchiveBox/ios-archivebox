<section class="hero-gallery" aria-label="ArchiveBox on Mac and iPhone">
  <div class="hero-gallery-viewport" tabindex="0" aria-label="App screenshots. Scroll sideways to explore.">
    <div class="hero-gallery-track">
      <div class="hero-gallery-group">
        {% if site.data.screenshots %}
        {% for capture in site.data.screenshots.captures %}
        {% assign image_path = '/screenshots/' | append: capture.path %}
        <a class="hero-gallery-card" href="{{ image_path | relative_url }}?v={{ site.data.screenshots.revision }}"><img src="{{ image_path | relative_url }}?v={{ site.data.screenshots.revision }}" width="{{ capture.width }}" height="{{ capture.height }}" alt="{{ capture.title | escape }} on {{ capture.platform_label | escape }}" loading="lazy"></a>
        {% endfor %}
        {% else %}
        <a class="hero-gallery-card" href="{{ '/docs/screenshots/library-mac.png' | relative_url }}"><img src="{{ '/docs/screenshots/library-mac.png' | relative_url }}" width="4320" height="3132" alt="ArchiveBox on Mac, showing saved snapshots and collection navigation" fetchpriority="high"></a>
        <a class="hero-gallery-card" href="{{ '/docs/screenshots/home-iphone.png' | relative_url }}"><img src="{{ '/docs/screenshots/home-iphone.png' | relative_url }}" width="1500" height="3000" alt="ArchiveBox on iPhone with collection, tags, and server tools"></a>
        <a class="hero-gallery-card" href="{{ '/docs/screenshots/extension-iphone.png' | relative_url }}"><img src="{{ '/docs/screenshots/extension-iphone.png' | relative_url }}" width="1500" height="3000" alt="ArchiveBox Safari extension confirming a saved page"></a>
        <a class="hero-gallery-card" href="{{ '/docs/screenshots/connection-mac.png' | relative_url }}"><img src="{{ '/docs/screenshots/connection-mac.png' | relative_url }}" width="800" height="760" alt="ArchiveBox Connection Settings on Mac with the local server running on port 5797 and the API key verified"></a>
        <a class="hero-gallery-card" href="{{ '/docs/screenshots/archive-mac.png' | relative_url }}"><img src="{{ '/docs/screenshots/archive-mac.png' | relative_url }}" width="800" height="760" alt="Archived pages on Mac" loading="lazy"></a>
        <a class="hero-gallery-card" href="{{ '/docs/screenshots/archive-iphone.png' | relative_url }}"><img src="{{ '/docs/screenshots/archive-iphone.png' | relative_url }}" width="1206" height="2622" alt="Archived pages on iPhone" loading="lazy"></a>
        <a class="hero-gallery-card" href="{{ '/docs/screenshots/persona.png' | relative_url }}"><img src="{{ '/docs/screenshots/persona.png' | relative_url }}" width="1206" height="2622" alt="Browser personas on iPhone" loading="lazy"></a>
        {% endif %}
      </div>
    </div>
  </div>
</section>
<script src="{{ '/assets/hero-gallery.js' | relative_url }}" defer></script>
