name: ArchiveBox
options:
  bundleIdPrefix: io.archivebox
  deploymentTarget:
    iOS: '26.0'
  xcodeVersion: '26.0'
packages:
  ArchiveBoxCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    # Set a team in Xcode or pass DEVELOPMENT_TEAM=... when building for a device.
    ARCHIVEBOX_KEYCHAIN_GROUP: '$(AppIdentifierPrefix)io.archivebox.shared'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  ArchiveBox:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ArchiveBoxCore
      - target: ArchiveBoxShare
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ArchiveBox
        ArchiveBoxKeychainGroup: '$(ARCHIVEBOX_KEYCHAIN_GROUP)'
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Connect to your ArchiveBox server on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: App/ArchiveBox.entitlements
      properties:
        keychain-access-groups: ['$(ARCHIVEBOX_KEYCHAIN_GROUP)']
  ArchiveBoxShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - App/AppEnvironment.swift
      - App/Assets.xcassets
    dependencies:
      - package: ArchiveBoxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.archivebox.ArchiveBox.Share
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: ArchiveBox
        ArchiveBoxKeychainGroup: '$(ARCHIVEBOX_KEYCHAIN_GROUP)'
        NSLocalNetworkUsageDescription: Send shared links to your ArchiveBox server on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: '$(PRODUCT_MODULE_NAME).ShareViewController'
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 20
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/ArchiveBoxShare.entitlements
      properties:
        keychain-access-groups: ['$(ARCHIVEBOX_KEYCHAIN_GROUP)']
  ArchiveBoxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ArchiveBox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ArchiveBox:
    build:
      targets:
        ArchiveBox: all
        ArchiveBoxUITests: [test]
    test:
      targets: [ArchiveBoxUITests]
      environmentVariables:
        ARCHIVEBOX_TEST_SERVER: '$(ARCHIVEBOX_TEST_SERVER)'
        ARCHIVEBOX_TEST_TOKEN: '$(ARCHIVEBOX_TEST_TOKEN)'
