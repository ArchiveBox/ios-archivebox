<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#9b2854">
    {% seo %}
    <meta name="robots" content="index,follow,max-image-preview:large">
    <meta property="og:image:type" content="image/png">
    <link rel="icon" type="image/x-icon" href="{{ '/assets/favicon.ico' | relative_url }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/icon.png' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
    <!-- Pages can cache CSS across deployments; version it so new markup gets matching styles. -->
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <!-- ARCHIVEBOX:HEADER -->
    <main id="content" class="markdown-body">{{ content }}</main>
    <!-- ARCHIVEBOX:FOOTER-START -->
<div class="abx-footer-local"><span>Made for your devices. Built in the open.</span> · <a href="{{ '/' | relative_url }}#privacy-and-license">Privacy &amp; license</a> · <a href="{{ '/' | relative_url }}#development">Developers</a></div>
<!-- ARCHIVEBOX:FOOTER-END -->
    <script>
      // A direct privacy/developer link must expose its content; ordinary visits
      // keep the README's supplementary sections collapsed, just like GitHub.
      function revealLinkedDetails() {
        const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (!target) return;
        let details = target.closest('details');
        while (details) { details.open = true; details = details.parentElement.closest('details'); }
      }
      addEventListener('hashchange', revealLinkedDetails);
      revealLinkedDetails();
    </script>
    <script src="{{ '/assets/platform-cta.js' | relative_url }}" defer></script>
  </body>
</html>
