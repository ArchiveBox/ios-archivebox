title: ArchiveBox.app
description: ArchiveBox.app brings your archive to your Apple devices. Share a link, browse saved pages, and manage your collection from one native app.
url: https://app.archivebox.io
baseurl: ""
theme: jekyll-theme-primer
lang: en-US
repository: ArchiveBox/ios-archivebox
logo: /assets/icon.png
twitter:
  username: ArchiveBoxApp
  card: summary_large_image
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/social-card.png
        width: 1200
        height: 630
        alt: "ArchiveBox.app. ArchiveBox.app brings your archive to your Apple devices. Share a link, browse saved pages, and manage your collection from one native app."
plugins:
  - jekyll-seo-tag
kramdown:
  input: GFM
  syntax_highlighter: rouge
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - build.sh
  - vendor
