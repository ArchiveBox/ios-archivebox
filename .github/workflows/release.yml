name: Release apps
on:
  push:
    branches: [main]
    paths-ignore: ['.github/pages/**', 'README.md', 'docs/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
    inputs:
      archivebox_version:
        description: Immutable ArchiveBox release version from the release coordinator
        required: false
        type: string
permissions:
  contents: write
# Reserve versions and publish in order. New pushes can supersede queued candidates.
concurrency:
  group: release-apps-main
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.version.outputs.ready }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      image_version: ${{ steps.image.outputs.version }}
      client_changed: ${{ steps.scope.outputs.client_changed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v7
        if: inputs.archivebox_version != ''
      - name: Resolve dispatched ArchiveBox image
        if: inputs.archivebox_version != ''
        env:
          ARCHIVEBOX_VERSION: ${{ inputs.archivebox_version }}
        run: uv run --no-project python ServerApp/server-image.py resolve
      - name: Record the verified image as app source
        if: inputs.archivebox_version != ''
        env:
          ARCHIVEBOX_VERSION: ${{ inputs.archivebox_version }}
        run: node scripts/sync-server-image.mjs
      - name: Select pinned ArchiveBox image version
        id: image
        run: |
          if test -f ServerApp/core-image.json; then
            echo "version=$(node -p 'require("./ServerApp/core-image.json").version')" >> "$GITHUB_OUTPUT"
          fi
      - name: Select client distribution scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
          ARCHIVEBOX_VERSION: ${{ inputs.archivebox_version }}
        run: |
          if test "$EVENT_NAME" = workflow_dispatch; then
            if test -n "$ARCHIVEBOX_VERSION"; then
              echo 'client_changed=false' >> "$GITHUB_OUTPUT"
            else
              echo 'client_changed=true' >> "$GITHUB_OUTPUT"
            fi
          else
            base="$BEFORE_SHA"
            if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
            changed_paths="$(git diff --name-only "$base" "$SOURCE_SHA")"
            if grep -Eq '^(App/|MacApp/|MacLocalUI/|ShareExtension/|Widgets/|MacShareExtension/|SafariWebExtension/|Sources/|Package\.(swift|resolved)$|project\.yml$|scripts/(prepare-safari\.mjs|testflight[^/]*|verify-signing\.py)$|\.github/workflows/(testflight|release)\.yml$)' <<< "$changed_paths"; then
              echo 'client_changed=true' >> "$GITHUB_OUTPUT"
            else
              echo 'client_changed=false' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Reserve version for this main commit
        id: version
        run: node scripts/release.mjs prepare
  release:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: xcode-27
    environment: testflight
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'
      - uses: astral-sh/setup-uv@v7
      - name: Prepare pinned Safari extension
        run: node scripts/prepare-safari.mjs
      - name: Test shared code
        run: swift test
      - name: Resolve pinned ArchiveBox image from both registries
        id: server-image
        env:
          ARCHIVEBOX_VERSION: ${{ needs.prepare.outputs.image_version }}
        run: uv run --no-project python ServerApp/server-image.py resolve
      - name: Verify immutable image lock
        if: needs.prepare.outputs.image_version != ''
        run: |
          node -e 'const fs=require("fs"); const a=require("./ServerApp/core-image.json"); const b=JSON.parse(fs.readFileSync("ServerApp/payload/resolved-image.json")); for(const key of ["version","digest","revision"]) if(a[key]!==b[key]) throw Error(`Bundled image ${key} differs from the release lock`)'
      - uses: actions/cache/restore@v4
        id: payload
        with:
          path: |
            ServerApp/vendor
            ServerApp/payload/images.tar
            ServerApp/payload/vmlinux
          key: server-payload-arm64-${{ steps.server-image.outputs.digest }}-${{ hashFiles('ServerApp/prepare.sh', 'ServerApp/server-image.py') }}
      - name: Download resolved server runtime and images
        if: steps.payload.outputs.cache-hit != 'true'
        env:
          ARCHIVEBOX_SERVER_IMAGE: ${{ steps.server-image.outputs.image }}
        run: bash ServerApp/prepare.sh
      - uses: actions/cache/save@v4
        if: steps.payload.outputs.cache-hit != 'true'
        with:
          path: |
            ServerApp/vendor
            ServerApp/payload/images.tar
            ServerApp/payload/vmlinux
          key: server-payload-arm64-${{ steps.server-image.outputs.digest }}-${{ hashFiles('ServerApp/prepare.sh', 'ServerApp/server-image.py') }}
      - name: Build, sign, notarize and verify both ZIPs
        env:
          ARCHIVEBOX_SERVER_IMAGE: ${{ steps.server-image.outputs.image }}
          DEVELOPER_ID_PROFILES: ${{ secrets.DEVELOPER_ID_PROFILES }}
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash scripts/release-macos.sh
      - name: Publish tested artifacts and release notes
        id: publish
        env:
          TESTFLIGHT_PUBLIC_URL: ${{ vars.TESTFLIGHT_PUBLIC_URL }}
        run: node scripts/release.mjs publish
  testflight:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.client_changed == 'true'
    uses: ./.github/workflows/testflight.yml
    secrets: inherit
    with:
      platform: both
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
